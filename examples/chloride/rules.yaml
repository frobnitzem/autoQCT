emin:
    resource: &psi4
        time: 7
        nrs: 1
        cpu: 1
    inp:
        crd: frame_{n}.npy
    out:
        en: emin_{n}.txt
    script: |
        {mpirun} ../qct.py emin {inp[crd]} {out[en]}

ebind:
    resource:
        <<: *psi4
    inp:
        crd: frame_{n}.npy
    out:
        en: bind_{n}.json
    script: |
        {mpirun} ../qct.py ebind {inp[crd]} {out[en]}

# Delta G using particle deletion.
dg_nm1_n:
    resource: &simple
        time: 2
        nrs:  1
        cpu:  1
    inp: {}
    loop:
        n: "range(0,{frames})"
        inp:
            en: bind_{n}.json
    out:
        dg: dg_nm1_n.en
    script: |
        {mpirun} ../qct.py exp_pos bind_%d.json {frames} {out[dg]}

# Single-point solvation FE calc.
solv:
    resource:
        <<: *psi4
    inp:
        crd: frame_{n}.npy
    out:
        muex: solv_{n}.json
    script: |
        {mpirun} ../qct.py solv {inp[crd]} {out[muex]}

# Delta G using particle insertion
dg_solv:
    resource:
        <<: *simple
    inp: {}
    loop:
        n: "range(0,{frames})"
        inp:
            muex: solv_{n}.json
    out:
        solv: dg_solv.json
    script: |
        {mpirun} ../qct.py exp_neg solv_%d.json {frames} {out[solv]}

# Rigid Rotor Harmonic Oscillator Free Energy Estimate
rrho:
    resource:
        time: 240
        nrs: 1
        cpu: 4
    inp:
        trr: ../traj.xyz
    out:
        thermo: thermo.json
    script: |
        if [ -s ../rrho.json ]; then
            cp ../rrho.json thermo.json
        else
            {mpirun} ../qct.py rrho1 {inp[trr]} {out[thermo]} 1
        fi

# Calculate solvent-solute binding energy
ecluster:
    resource:
        <<: *psi4
    inp:
        crd: frame_{n}.npy
    out:
        en: ecluster.txt
    script: |
        {mpirun} ../qct.py ecluster {inp[crd]} {out[en]}
